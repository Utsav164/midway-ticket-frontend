# ═══════════════════════════════════════════════════════════════════════════════
# Frontend CI — MidwayTicket web app
#
# Deploy itself is handled by Vercel's own GitHub integration (auto-deploys
# on push to main / preview-deploys on PRs) — this workflow does NOT deploy,
# it only gates merges on lint/type-check/build passing, so a broken build
# never reaches Vercel's deploy step.
#
# When the payment gateway is added later, no change to this file is
# needed — checkout UI changes ship the same way everything else does.
# Any new public env vars (e.g. NEXT_PUBLIC_RAZORPAY_KEY_ID) just get added
# in Vercel's dashboard, not here.
# ═══════════════════════════════════════════════════════════════════════════════

name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build
        env:
          # Placeholder value only — real value lives in Vercel's env vars.
          # Present here purely so `next build` doesn't fail on a missing var.
          NEXT_PUBLIC_API_URL: https://api.example.com
